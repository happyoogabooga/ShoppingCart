<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
        <title>details</title>
    </head>
    <body class="details-page">
        <header class="home-header">
            <nav class="home-nav" aria-label="Main navigation">
                <a class="home-brand" href="home.html">Record Shop</a>
                <div class="home-nav-links">
                    <a href="{{ url_for('shopping_cart_ui.user_home') }}" aria-current="page">Albums</a>
                </div>
                <div class = "home-nav-links">
                    <a href ="/account/dashboard">Dashboard</a>
                </div>
            </nav>
        </header>
        <!--this will most likely be the container-->
        <div class = "container">
            <div style = "display:block">
                <!--the album cover and name go on this line-->
                <div style = "display:flex">
                    <div class = "album">
                        <img src = "{{listing.image}}">
                        <p style = "padding:20px">price: {{listing.price}}</p>
                    </div>
                    <div>
                        <h1>
                            Title: {{listing.title}}
                        </h1>
                    </div>
                </div>
                <!--description of the album goes here-->
                <div class = "albumDetails">
                    illmatic is the freshman album of legendary rapper nas.
                </div>
                <div>
                    <p> provided by: {{provider.name}}</p>
                </div>
                <!--checkout the album here-->
                <div class="checkout-bar">
                    <form action = "/album/cart/add/{{listing.sku}}" method = "POST">
                        <button  class = "formSubmit" type = "submit">
                            Add To Cart
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </body>
</html>
