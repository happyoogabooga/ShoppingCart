<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Albums | Shopping Cart</title>
        <link rel="stylesheet" href="../static/styles.css">
    </head>
    <body class="home-page">
        <header class="home-header">
            <nav class="home-nav">
                <a class="home-brand" href="{{ url_for('shopping_cart_ui.user_home') }}">Record Shop</a>
                <div class="home-nav-links">
                    <a href="{{ url_for('shopping_cart_ui.user_home') }}">Albums</a>
                </div>
                <div class = "home-nav-links">
                    <a href  = "/account/dashboard">Dashboard</a>
                </div>
            </nav>
        </header>

        <div class="home-main">
            <div class="album-section" aria-labelledby="albums-heading">
                <div class="album-section-header">
                    <div>
                        <p class="eyebrow">Find your next favorite</p>
                        <h1>Browse albums</h1>
                    </div>
                    <div class="album-search">
                        <label class="visually-hidden" for="album-search">Search albums by title</label>
                        <input
                            id="album-search"
                            type="search"
                            name="title"
                            placeholder="Search albums by title"
                        >
                    </div>
                </div>

                <div class="album-grid">
                    {%for item in album_listings%}
                    <article class="album-card">
                        <a class="album-cover-link" href="{{ url_for('shopping_cart_ui.album_details', sku=item.sku) }}" aria-label="View {{ item.title }} details">
                            <img
                                class="album-cover"
                                src="{{item.image}}"
                                alt="{{item.title}} album cover"
                            >
                        </a>
                        <div class="album-card-content">
                            <div>
                                <h2 class="album-title">{{item.title}}</h2>
                                <p class="album-artist">{{item.artist}}</p>
                                <p class="album-description">
                                    {{item.description}}
                                </p>
                                <p class = "album-description">{{item.provider_id}}</p>
                            </div>
                            <a class="album-card-link" href="{{ url_for('shopping_cart_ui.album_details', sku=item.sku) }}">View details</a>
                        </div>
                    </article>
                    {% endfor %}
                </div>
            </div>

            <footer class="home-footer" id="about">
                <p>albums!</p>
            </footer>
        </div>
    </body>
</html>
