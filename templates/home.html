<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Albums | Shopping Cart</title>
        <link rel="stylesheet" href="../static/styles.css">
    </head>
    <body class="home-page">
        <header class="home-header">
            <nav class="home-nav">
                <a class="home-brand" href="home.html">Record Shop</a>
                <div class="home-nav-links">
                    <a href="home.html">Albums</a>
                </div>
                <div class = "home-nav-links">
                    <a href  = "dashboard.html">Dashboard</a>
                </div>
            </nav>
        </header>

        <div class="home-main">
            <div class="album-section" aria-labelledby="albums-heading">
                <div class="album-section-header">
                    <div>
                        <p class="eyebrow">Find your next favorite</p>
                        <h1>Browse albums</h1>
                    </div>
                    <div class="album-search">
                        <label class="visually-hidden" for="album-search">Search albums by title</label>
                        <input
                            id="album-search"
                            type="search"
                            name="title"
                            placeholder="Search albums by title"
                        >
                    </div>
                </div>

                <div class="album-grid">
                    <article class="album-card">
                        <a class="album-cover-link" href="details.html" aria-label="View Illmatic details">
                            <img
                                class="album-cover"
                                src="https://m.media-amazon.com/images/I/51cyOjw5duL._AC_UL450_SY450_QL70_.jpg"
                                alt="Illmatic album cover"
                            >
                        </a>
                        <div class="album-card-content">
                            <div>
                                <h2 class="album-title">Illmatic</h2>
                                <p class="album-artist">Nas</p>
                                <p class="album-description">
                                    The debut album from legendary rapper Nas.
                                </p>
                            </div>
                            <a class="album-card-link" href="details.html">View details</a>
                        </div>
                    </article>
                </div>
            </div>

            <footer class="home-footer" id="about">
                <p>albums!</p>
            </footer>
        </div>
    </body>
</html>
