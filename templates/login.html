<!DOCTYPE html>
<html>
    <head>
        <title>Login page</title>
        <link rel = "StyleSheet" href = "../static/styles.css">
    </head>
    <body>
        <nav>
            <div>
                HOME
            </div>
            <div>
                picture
            </div>
            <div>
                about
            </div>
        </nav>
        <!-- below is the conatiner for the banner and the password input -->
        <div>
            <div class = "container"> 
                <!-- This is the username/password card(yes cards are back) -->
                <div class = "card">
                    <!--This is the head for the card, probably the only text here will be "login"-->
                    <div class = "cardHead">
                        <h2> Login </h2>
                    </div>
                    <div class = "cardBody">
                        <form id = "studentLogin" action="/account/login" method="POST">
                            {% if error %}
                                <p role="alert">{{ error }}</p>
                            {% endif %}
                            <div class = "formstyle">
                                <label for = "username" class = "formLabel">Username*</label>
                                <input type = "text" id = "username" required class = "formcontrol" name = "username">
                            </div>
                            <div class = "formstyle">
                                <label for = "password" class = "formLabel">Password*</label>
                                <input type = "password" id = "password" required class = "formcontrol" name = "password">
                            </div>
                            <div class = "formstyle">
                                <input type = "submit" class = "formSubmit" value="Continue">
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
